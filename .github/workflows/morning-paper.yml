name: Morning Paper

on:
  schedule:
    # 每天北京时间 6:47 运行 (UTC 22:47)。避开整点，降低排队延迟
    - cron: '47 22 * * *'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  send-news:
    runs-on: ubuntu-latest
    # 需要写权限：发送成功后把已发送新闻的状态文件提交回仓库，供下次运行跨天判重
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，保证提交状态文件前能 rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Job
        run: node dist/once.js
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_DOMESTIC_KEYWORDS: ${{ secrets.NEWS_DOMESTIC_KEYWORDS }}
          NEWS_INTL_KEYWORDS: ${{ secrets.NEWS_INTL_KEYWORDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}

      # 发送成功才会走到这里（Run Job 失败时后续步骤自动跳过），
      # 把已发送记录提交回仓库，作为下次运行的跨天判重依据
      - name: Save sent state
        run: |
          if [ ! -f data/sent-news.json ]; then
            echo "状态文件不存在，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sent-news.json
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): 更新已发送新闻记录"
          git pull --rebase origin main || true
          git push || echo "⚠️ 状态推送失败，下次运行跨天判重可能遗漏"
