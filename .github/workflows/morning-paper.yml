name: Morning Paper

on:
  schedule:
    # 每天北京时间 7:00 运行 (UTC 23:00/00:00，根据夏令时调整)
    - cron: '0 23 * * *'
  workflow_dispatch:  # 支持手动触发测试

jobs:
  send-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Job
        run: node dist/once.js
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_DOMESTIC_KEYWORDS: ${{ secrets.NEWS_DOMESTIC_KEYWORDS }}
          NEWS_INTL_KEYWORDS: ${{ secrets.NEWS_INTL_KEYWORDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
