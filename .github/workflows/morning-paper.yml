name: Morning Paper

on:
  schedule:
    # 双时段：GitHub schedule 高负载时会延迟甚至静默丢弃事件（不留 run 记录），
    # 主时段 6:47 之外加 7:23 候补兜底；代码内当日防重护栏保证最多发一封
    - cron: '47 22 * * *'   # 北京时间 6:47
    - cron: '23 23 * * *'   # 北京时间 7:23
  workflow_dispatch:  # 支持手动触发
    inputs:
      resend:
        description: '重发上一封邮件（不抓取、不耗 AI，可多次触发）'
        type: boolean
        default: true
      force:
        description: '跳过当日防重护栏，完整跑一次并生成新邮件（补发用）'
        type: boolean
        default: false

# 同一时间只允许一个实例：双时段撞车时后到的排队等待，
# 确保防重护栏能读到前一次已提交的状态
concurrency:
  group: morning-paper
  cancel-in-progress: false

jobs:
  send-news:
    runs-on: ubuntu-latest
    # 需要写权限：发送成功后把已发送新闻的状态文件提交回仓库，供下次运行跨天判重
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，保证提交状态文件前能 rebase

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Job
        run: node dist/once.js
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NEWS_DOMESTIC_KEYWORDS: ${{ secrets.NEWS_DOMESTIC_KEYWORDS }}
          NEWS_INTL_KEYWORDS: ${{ secrets.NEWS_INTL_KEYWORDS }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # 手动触发时按勾选注入：resend=纯重发上一封；force=跳过当日护栏完整跑
          RESEND: ${{ inputs.resend == true && '1' || '' }}
          FORCE_RUN: ${{ inputs.force == true && '1' || '' }}

      # 发送成功才会走到这里（Run Job 失败时后续步骤自动跳过），
      # 把已发送记录和最后一封邮件提交回仓库，作为跨天判重和手动重发的数据源
      - name: Save sent state
        run: |
          if [ ! -d data ]; then
            echo "状态目录不存在，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore(state): 更新已发送新闻记录"
          git pull --rebase origin main || true
          git push || echo "⚠️ 状态推送失败，下次运行跨天判重可能遗漏"
